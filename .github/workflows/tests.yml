name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "true"

jobs:
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore services/orders/tests/Versta.Orders.Domain.Tests/Versta.Orders.Domain.Tests.csproj

      - name: Run unit tests
        run: >
          dotnet test services/orders/tests/Versta.Orders.Domain.Tests/Versta.Orders.Domain.Tests.csproj
          --configuration Release
          --no-restore
          --logger "junit;LogFilePath=${{ github.workspace }}/TestResults/unit/unit-tests.xml;MethodFormat=Class;FailureBodyFormat=Verbose"

      - name: Upload unit test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-results
          path: TestResults/unit/unit-tests.xml
          if-no-files-found: warn
          retention-days: 7

  integration-tests:
    name: Integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Verify Docker
        run: |
          docker version
          docker compose version

      - name: Run integration tests
        env:
          VERSTA_INTEGRATION_PROJECT: versta-integration-${{ github.run_id }}-${{ github.run_attempt }}
          VERSTA_INTEGRATION_RESULTS_DIR: ${{ github.workspace }}/TestResults/integration
        run: ./scripts/run-integration-tests.sh

      - name: Upload integration test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: integration-test-results
          path: TestResults/integration/integration-tests.xml
          if-no-files-found: warn
          retention-days: 7
