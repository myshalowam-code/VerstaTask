services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: versta_orders
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d versta_orders"]
      interval: 5s
      timeout: 3s
      retries: 12

  mongo:
    image: mongo:8
    volumes:
      - mongo-data:/data/db
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok"]
      interval: 5s
      timeout: 3s
      retries: 12

  kafka:
    image: apache/kafka:4.0.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-data:/var/lib/kafka/data
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 20

  auth-migrations:
    build:
      context: .
      dockerfile: services/auth/Dockerfile
    command: ["--migrate-only"]
    environment:
      ConnectionStrings__Auth: Host=postgres;Port=5432;Database=versta_auth;Username=postgres;Password=postgres
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  auth-api:
    build:
      context: .
      dockerfile: services/auth/Dockerfile
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Auth: Host=postgres;Port=5432;Database=versta_auth;Username=postgres;Password=postgres
      Jwt__Key: versta-local-development-signing-key-2026-change-me
      Jwt__Issuer: versta-auth
      Jwt__Audience: versta-api
    depends_on:
      postgres:
        condition: service_healthy
      auth-migrations:
        condition: service_completed_successfully

  orders-migrations:
    build:
      context: .
      dockerfile: services/orders/Dockerfile
    command: ["--migrate-only"]
    environment:
      ConnectionStrings__EventStore: Host=postgres;Port=5432;Database=versta_orders;Username=postgres;Password=postgres
      ConnectionStrings__ReadModel: mongodb://mongo:27017
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
    restart: "no"

  orders-api:
    build:
      context: .
      dockerfile: services/orders/Dockerfile
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__EventStore: Host=postgres;Port=5432;Database=versta_orders;Username=postgres;Password=postgres
      ConnectionStrings__ReadModel: mongodb://mongo:27017
      Kafka__BootstrapServers: kafka:9092
      Kafka__OrdersTopic: orders.events
      Jwt__Key: versta-local-development-signing-key-2026-change-me
      Jwt__Issuer: versta-auth
      Jwt__Audience: versta-api
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
      kafka:
        condition: service_healthy
      orders-migrations:
        condition: service_completed_successfully

  orders-projection:
    build:
      context: .
      dockerfile: services/orders/Projection.Dockerfile
    environment:
      ConnectionStrings__ReadModel: mongodb://mongo:27017
      Kafka__BootstrapServers: kafka:9092
      Kafka__OrdersTopic: orders.events
    depends_on:
      mongo:
        condition: service_healthy
      kafka:
        condition: service_healthy
      orders-migrations:
        condition: service_completed_successfully

  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    environment:
      ASPNETCORE_URLS: http://+:8080
      FrontendOrigin: http://localhost:5173
    ports:
      - "5080:8080"
    depends_on:
      - auth-api
      - orders-api

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
      args:
        VITE_API_URL: http://localhost:5080
    ports:
      - "5173:80"
    depends_on:
      - gateway

volumes:
  postgres-data:
  mongo-data:
  kafka-data:
